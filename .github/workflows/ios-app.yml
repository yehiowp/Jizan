name: iPhone app (native)

# Compiles the native SwiftUI app in personal-ledger/ios on a GitHub macOS runner
# and packages an unsigned .ipa. Install it by signing it with your own Apple ID
# (see personal-ledger/ios/README.md). No Apple credentials are stored here.
on:
  push:
    paths:
      - 'personal-ledger/ios/**'
      - '.github/workflows/ios-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: personal-ledger/ios
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iPhone without signing
        run: |
          set -o pipefail
          xcodebuild -project PersonalLedger.xcodeproj -scheme PersonalLedger \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/PersonalLedger.app
          test -d "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          # The icon is compiled and referenced, and the Shortcuts action metadata is bundled.
          test -f "$APP/Assets.car"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName' "$APP/Info.plist")" = AppIcon
          test -d "$APP/Metadata.appintents"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry PersonalLedger-unsigned.ipa Payload
          ls -l PersonalLedger-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v6
        with:
          name: PersonalLedger-unsigned-ipa
          path: personal-ledger/ios/PersonalLedger-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-log
          path: personal-ledger/ios/build.log
